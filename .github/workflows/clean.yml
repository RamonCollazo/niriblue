name: clean
on:
  schedule:
    - cron: "15 0 * * 0"
  workflow_dispatch:
jobs:
  clean:
    name: Clean old ghcr images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          package: niriblue
          older-than: 30 days
          keep-n-tagged: 7
          exclude-tags: latest,44
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
